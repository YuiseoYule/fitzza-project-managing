name: Validate WBS data
on:
  pull_request:
    paths: ['data/**', 'schemas/**', 'scripts/**']
  push:
    branches: [main]
    paths: ['data/**', 'schemas/**', 'scripts/**']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm install
      - run: npm run validate:data
